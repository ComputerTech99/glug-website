name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Type + content schema check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: End-to-end tests (builds the site)
        run: npm run e2e
        env:
          CI: 'true'
      - name: Lighthouse (mobile, all categories >= 90)
        run: npx lhci autorun
